<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Markdown Viewer</title>
<link rel="stylesheet" href="viewer.css" />
<link rel="stylesheet" href="../lib/chess.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-tabs" role="tablist">
        <button class="sb-tab active" data-pane="toc" role="tab" aria-selected="true">
          <span class="ico">☰</span><span data-i18n="toc">TOC</span>
        </button>
        <button class="sb-tab" data-pane="files" role="tab" aria-selected="false" disabled title="Coming soon">
          <span class="ico">📁</span><span data-i18n="files">Files</span>
        </button>
      </div>
      <div class="sidebar-body">
        <nav class="pane pane-toc" id="toc" aria-label="Table of contents"></nav>
        <div class="pane pane-files" id="files" hidden>
          <div class="empty">
            <div class="empty-ico">📁</div>
            <div class="empty-title" data-i18n="files">Files</div>
            <div class="empty-sub" data-i18n="file_browser_soon">File browser — coming soon</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar" role="toolbar" aria-label="Viewer toolbar">
        <button class="icon-btn" id="toggle-sidebar" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
          <span>☰</span>
        </button>
        <div class="doc-title" id="doc-title">Markdown</div>

        <div class="search-wrap" id="search-wrap">
          <input type="text" id="search-input" class="search-input" placeholder="Search…" spellcheck="false" autocomplete="off" aria-label="Search in document">
          <span class="search-count" id="search-count"></span>
          <button class="icon-btn search-prev" id="search-prev" title="Previous match (Shift+Enter)" aria-label="Previous match">
            <span>↑</span>
          </button>
          <button class="icon-btn search-next" id="search-next" title="Next match (Enter)" aria-label="Next match">
            <span>↓</span>
          </button>
          <button class="icon-btn search-clear" id="search-clear" title="Clear search (Esc)" aria-label="Clear search">
            <span>✕</span>
          </button>
        </div>

        <div class="spacer"></div>

        <label class="ctrl">
          <span data-i18n="width">Width</span>
          <select id="width">
            <option value="narrow" data-i18n="width_narrow">Narrow</option>
            <option value="normal" data-i18n="width_normal">Normal</option>
            <option value="wide" data-i18n="width_wide">Wide</option>
          </select>
        </label>
        <label class="ctrl">
          <span data-i18n="theme">Theme</span>
          <select id="theme">
            <option value="light" data-i18n="theme_light">Light</option>
            <option value="dark" data-i18n="theme_dark">Dark</option>
            <option value="sepia" data-i18n="theme_sepia">Sepia</option>
          </select>
        </label>
        <label class="ctrl">
          <span data-i18n="direction">Direction</span>
          <select id="dir">
            <option value="auto" data-i18n="direction_auto">Auto</option>
            <option value="rtl" data-i18n="direction_rtl">RTL</option>
            <option value="ltr" data-i18n="direction_ltr">LTR</option>
          </select>
        </label>
        <label class="ctrl">
          <input type="checkbox" id="tag" />
          <span data-i18n="per_block_bidi">Per-block bidi</span>
        </label>
        <label class="ctrl">
          <span data-i18n="size">Size</span>
          <input type="range" id="size" min="14" max="22" step="1" value="16" />
        </label>
        <button class="icon-btn" id="help-btn" title="Help (?)" aria-label="Help">?</button>
      </header>

      <div class="main-scroll" id="main-scroll">
        <article id="content" class="markdown-body" aria-live="polite"></article>
      </div>
    </main>
  </div>

  <script src="../lib/highlight.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../lib/direction.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/chess-fen.js"></script>
  <script src="../lib/chess-annotations.js"></script>
  <script src="../lib/chess-shim.js"></script>
  <script src="../lib/chess.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
