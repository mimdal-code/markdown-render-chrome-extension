<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<title>Markdown RTL/LTR</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f7f8fa; --bd:#e2e5ea; --accent:#0066cc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1f22; --fg:#e6e6e6; --muted:#9aa0a6; --card:#26282c; --bd:#3a3d42; --accent:#4c9aff; }
  }
  body { margin:0; width: 300px; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  .wrap { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .btn { display:block; width:100%; text-align:center; padding:9px 12px; border-radius:8px; border:1px solid var(--bd); background:var(--card); color:var(--fg); cursor:pointer; font-size:13px; margin-bottom:8px; text-decoration:none; }
  .btn.primary { background: var(--accent); color:#fff; border-color: var(--accent); font-weight:600; }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; }
  .current { font-size:11px; color: var(--muted); word-break: break-all; margin-top:8px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Markdown RTL/LTR</h1>
    <a class="btn primary" id="open" href="#" target="_blank">Open viewer for this page</a>
    <button class="btn" id="opts">Options</button>
    <div class="hint">The viewer auto-renders <code>.md</code> / <code>.markdown</code> pages you open.</div>
    <div class="current" id="current"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
