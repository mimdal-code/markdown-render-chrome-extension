name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*'  # Triggers when pushing tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write  # Required permission to create Release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package extension
        run: |
          zip -r "md-rtl-reader-${{ steps.get_version.outputs.VERSION }}.zip" \
            manifest.json src assets \
            -x '*.DS_Store' '*/node_modules/*' '*/.git/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: md-rtl-reader-${{ steps.get_version.outputs.VERSION }}.zip
          generate_release_notes: true  # Automatically generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}